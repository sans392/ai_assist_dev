services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app  # hot-reload: code changes apply instantly
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ollama-net

networks:
  ollama-net:
    external: true
