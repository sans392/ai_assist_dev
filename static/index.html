<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .mode-select {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-select label {
            font-size: 13px;
            color: #888;
        }

        .mode-select select {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .status-bar {
            padding: 6px 20px;
            font-size: 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            background: #555;
        }

        .status-dot.connected { background: #4caf50; }
        .status-dot.disconnected { background: #f44336; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #2563eb;
        }

        .message.assistant .avatar {
            background: #7c3aed;
        }

        .message .content {
            flex: 1;
            line-height: 1.6;
            font-size: 14px;
            padding-top: 4px;
        }

        .message .content pre {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .message .content code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message .content pre code {
            background: none;
            padding: 0;
        }

        .typing-indicator {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: #7c3aed;
            border-radius: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-area {
            padding: 16px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }

        .input-wrapper {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 150px;
            line-height: 1.5;
        }

        #input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        #input::placeholder {
            color: #666;
        }

        #send-btn {
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        #send-btn:hover { background: #6d28d9; }
        #send-btn:disabled { background: #3a3a3a; color: #666; cursor: not-allowed; }

        .welcome {
            max-width: 720px;
            margin: auto;
            text-align: center;
            color: #666;
        }

        .welcome h2 {
            font-size: 24px;
            color: #888;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Assistant</h1>
        <div class="mode-select">
            <label for="mode">Mode:</label>
            <select id="mode">
                <option value="general">General</option>
                <option value="financial">Financial Analyst</option>
                <option value="sports">Sports</option>
            </select>
        </div>
    </header>
    <div class="status-bar">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Checking connection...</span>
    </div>

    <div id="chat">
        <div class="welcome">
            <h2>AI Assistant</h2>
            <p>Send a message to start a conversation</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const modeEl = document.getElementById('mode');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        let isStreaming = false;
        let conversationId = null;  // assigned by server on first response

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
        });

        // Send on Enter (Shift+Enter for new line)
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Reset conversation on mode change
        modeEl.addEventListener('change', () => {
            conversationId = null;
            chatEl.innerHTML = `
                <div class="welcome">
                    <h2>AI Assistant</h2>
                    <p>Mode changed to ${modeEl.options[modeEl.selectedIndex].text}. New conversation started.</p>
                </div>`;
        });

        // Check Ollama connection
        async function checkHealth() {
            try {
                const resp = await fetch('/health');
                const data = await resp.json();
                const ok = data.ollama === 'connected';
                statusDot.className = 'status-dot ' + (ok ? 'connected' : 'disconnected');
                statusText.textContent = ok ? 'Ollama connected' : 'Ollama unavailable';
            } catch {
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'API unreachable';
            }
        }
        checkHealth();
        setInterval(checkHealth, 30000);

        function addMessage(role, content) {
            // Remove welcome on first message
            const welcome = chatEl.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
                <div class="content"></div>
            `;
            chatEl.appendChild(div);
            const contentEl = div.querySelector('.content');
            if (content) contentEl.innerHTML = formatText(content);
            chatEl.scrollTop = chatEl.scrollHeight;
            return contentEl;
        }

        function formatText(text) {
            // Simple markdown: code blocks, inline code, bold, newlines
            return text
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage('user', text);

            const contentEl = addMessage('assistant', '');
            contentEl.innerHTML = '<span class="typing-indicator"></span>';

            try {
                const body = {
                    message: text,
                    mode: modeEl.value,
                    stream: true,
                };
                if (conversationId) body.conversation_id = conversationId;

                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Request failed');
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(line.slice(6));
                            if (data.content) {
                                fullText += data.content;
                                contentEl.innerHTML = formatText(fullText);
                                chatEl.scrollTop = chatEl.scrollHeight;
                            }
                            if (data.conversation_id) {
                                conversationId = data.conversation_id;
                            }
                        } catch { /* skip malformed lines */ }
                    }
                }

            } catch (err) {
                contentEl.innerHTML = `<span style="color:#f44336">Error: ${err.message}</span>`;
            }

            isStreaming = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    </script>
</body>
</html>
